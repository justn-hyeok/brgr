[workspace]
members = [
  "crates/brgr-cli",
  "crates/brgr-core",
  "crates/brgr-protocol",
  "crates/brgr-registry",
  "crates/brgr-runner",
  "crates/brgr-store",
]
resolver = "3"

[workspace.package]
version = "1.0.9"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.2.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
predicates = "3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
