name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      # Only main saves, so a pull request reuses main's cache and cannot change it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
        env:
          RUST_TEST_THREADS: 8
          CARGO_PROFILE_DEV_DEBUG: 0
      - run: cargo test --workspace --doc --locked
      # A pull request skips this: main and the release tag both build it.
      - if: github.event_name == 'push'
        run: cargo build --workspace --release --locked

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked --root "${RUNNER_TEMP}/cargo-deny"
      - name: Check advisories, licenses, bans, and sources
        run: |
          "${RUNNER_TEMP}/cargo-deny/bin/cargo-deny" deny --all-features \
            check advisories bans licenses sources
