name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The gate for a pull request: the tests take half as long here as on macOS.
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      # Only main saves, so a pull request reuses main's cache and cannot change it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Same-size edit test alone
        run: cargo test -p brgr-core a_same_size_edit --locked
      - run: cargo test --workspace --all-features --locked
        env:
          RUST_TEST_THREADS: "8"
      - run: cargo test --workspace --doc --locked
      - name: Repeat the land test under load
        run: |
          binary=$(cargo test -p brgr-cli --test cli_contract --no-run --locked --message-format=json 2>/dev/null | jq -r 'select(.executable != null and .profile.test == true) | .executable' | head -1)
          test -n "$binary"
          worker() { for run in $(seq 1 100); do out=$("$binary" land_three_way_is_a_failure_not_a_conflict_when_git_refuses_another_file --exact --nocapture 2>&1 || true); echo "$out" | grep -q "1 passed; 0 failed" || { echo "WORKER $1 FAILED AT $run"; echo "$out" | tail -12; return 1; }; done; }
          pids=""; for w in 1 2 3 4 5 6; do worker $w & pids="$pids $!"; done
          status=0; for p in $pids; do wait $p || status=1; done
          echo "land repeat status=$status of 600 runs"
          exit $status

  # The platform brgr ships for, on every push to main. The release tag runs the
  # tests here again before anything is published.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo build --workspace --release --locked

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked --root ~/.cargo-deny
      - name: Check advisories, licenses, bans, and sources
        run: |
          ~/.cargo-deny/bin/cargo-deny deny --all-features \
            check advisories bans licenses sources
