name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  unsigned-macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brgr-cli") | .version')"
          test "$expected" = "$actual"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p brgr-cli --release --locked
      - name: Verify Apple Silicon deployment target
        run: |
          test "$(uname -m)" = arm64
          file target/release/brgr | grep -q 'arm64'
          otool -l target/release/brgr | grep -A 5 'LC_BUILD_VERSION' | grep -q 'minos 15.0'
      - name: Package unsigned archive
        run: |
          archive="brgr-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir -p "dist/$archive"
          cp target/release/brgr README.md CHANGELOG.md LICENSE "dist/$archive/"
          cp -R docs "dist/$archive/docs"
          test -f "dist/$archive/docs/unsigned-distribution.md"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          tar -xzf "dist/$archive.tar.gz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/$archive/brgr" --version
          scratch="$(mktemp -d "${RUNNER_TEMP}/brgr-release-smoke.XXXXXX")"
          mkdir "$scratch/work"
          binary="${RUNNER_TEMP}/$archive/brgr"
          "$binary" --home "$scratch/home" harness add "$GITHUB_WORKSPACE/testdata/fixtures/gjc" \
            --workspace "$scratch/work" --prompt BRGR_FIXTURE_OK
          result="$(PATH=/bin:/usr/sbin:/sbin BRGR_OWNER_ID=codex:release-smoke BRGR_SESSION_ID=release-smoke "$binary" --home "$scratch/home" --json run BRGR_FIXTURE_OK --workspace "$scratch/work" --foreground)"
          task="$(printf '%s' "$result" | jq -er 'select(.outcome == "candidate" and .revision == 1) | .task_id')"
          detail="$(BRGR_OWNER_ID=codex:release-smoke BRGR_SESSION_ID=release-smoke "$binary" --home "$scratch/home" --json result "$task")"
          printf '%s' "$detail" | jq -e '.artifacts[0].text == "BRGR_FIXTURE_OK"'
          decision="$(BRGR_OWNER_ID=codex:release-smoke BRGR_SESSION_ID=release-smoke "$binary" --home "$scratch/home" --json accept "$task" --reason 'release fixture result verified')"
          printf '%s' "$decision" | jq -e '.verdict == "accepted"'
      - name: Generate SPDX SBOM
        run: |
          cargo install cargo-sbom --version 0.10.0 --locked --root "${RUNNER_TEMP}/brgr-sbom-tool"
          "${RUNNER_TEMP}/brgr-sbom-tool/bin/cargo-sbom" \
            --cargo-package brgr-cli \
            --project-directory "$GITHUB_WORKSPACE" > dist/brgr.spdx.json
          jq -e '
            .spdxVersion == "SPDX-2.3"
            and .name == "brgr-cli"
            and (.packages | length > 0)
            and all(.packages[]; .licenseDeclared != "NOASSERTION" and .licenseConcluded != "NOASSERTION")
          ' dist/brgr.spdx.json
      - name: Verify downloadable checksums
        run: |
          cd dist
          archive="brgr-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          shasum -a 256 "$archive.tar.gz" brgr.spdx.json > checksums.txt
          shasum -a 256 -c checksums.txt
      - name: Create unsigned draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/release-notes-${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            dist/*.tar.gz dist/checksums.txt dist/brgr.spdx.json
