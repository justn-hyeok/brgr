name: Release draft

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  unsigned-macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Verify tag and package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brgr-cli") | .version')"
          test "$expected" = "$actual"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p brgr-cli --release --locked
      - name: Package unsigned archive
        run: |
          archive="brgr-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir -p "dist/$archive"
          cp target/release/brgr README.md LICENSE "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          shasum -a 256 "dist/$archive.tar.gz" > dist/checksums.txt
          tar -xzf "dist/$archive.tar.gz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/$archive/brgr" --version
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/brgr.spdx.json
          artifact-name: brgr.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create unsigned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "UNSIGNED / NOT NOTARIZED macOS arm64 build. Verify checksums and read docs/unsigned-distribution.md before running." \
            dist/*.tar.gz dist/checksums.txt dist/brgr.spdx.json
